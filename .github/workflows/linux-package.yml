name: Linux executable and tarball

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/linux-package.yml'
      - 'packaging/**'
      - 'src/**'
      - 'tests/test_linux_release.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'LICENSE'
      - 'NOTICE'
      - 'LINUX-DISTRIBUTION.md'
      - 'examples/mock-safe.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      # The GUI is bundled with tkinter, which needs the system Tk runtime to
      # be present at build time.
      - name: Install system Tk and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libtk8.6
      - name: Validate version and packaging tests
        run: |
          python packaging/release_linux.py --check-version --ref "$SOURCE_REF" --commit "$SOURCE_SHA"
          python -m unittest discover -s tests -p test_linux_release.py -v
      - name: Install frozen application and pinned build tools
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --no-dev --no-install-project --python python
          uv pip install --python .venv/bin/python --no-deps -r packaging/requirements-linux-build.txt
          uv pip install --python .venv/bin/python --no-build-isolation --no-deps --editable .
          uv pip check --python .venv/bin/python
      - name: Build one console executable
        run: |
          .venv/bin/python -m PyInstaller --clean --noconfirm --workpath build/pyinstaller packaging/cardputer_linux.spec
      - name: Create allowlisted tarball
        run: |
          python packaging/release_linux.py --exe dist/cardputer --ref "$SOURCE_REF" --commit "$SOURCE_SHA"
      - name: Test extracted executable with authenticated mock HTTP
        run: |
          archive=(dist/cardputer-v*-linux-x64.tar.gz)
          [ "${#archive[@]}" -eq 1 ] || { echo 'Expected exactly one distribution tarball'; exit 1; }
          python packaging/smoke_linux.py --archive "${archive[0]}" --ref "$SOURCE_REF" --commit "$SOURCE_SHA"
      - name: Save verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-linux-x64-${{ github.run_id }}
          path: |
            dist/cardputer-v*-linux-x64.tar.gz
            dist/cardputer-v*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-linux-build-diagnostics-${{ github.run_id }}
          path: |
            build/pyinstaller/cardputer_linux/warn-cardputer_linux.txt
            build/pyinstaller/cardputer_linux/xref-cardputer_linux.html
          if-no-files-found: ignore
          retention-days: 7
