name: Full synthetic suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / shard ${{ matrix.shard }} of ${{ matrix.shards }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows legs are split into file shards (balanced by file size; see
        # packaging/full_suite.py shard_files). Lint/format/typing run once per
        # OS/Python on shard 1.
        include:
          - os: windows-2022
            python: '3.13.16'
            shard: 1
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 2
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 3
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 4
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 1
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 2
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 3
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 4
            shards: 4
            deadline: 900
          - os: ubuntu-24.04
            python: '3.13.16'
            shard: 1
            shards: 1
            deadline: 1200
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARDPUTER_GUI_SCREENSHOTS: test-diagnostics/gui
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install frozen verification environment
        id: environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --python python
      - name: Install Linux compiler-cache contract fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache
          ccache --version
          gcc --version
          cmake --version
      - name: Lint
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen ruff check src tests packaging/full_suite.py packaging/ci_process_tree.py
      - name: Format
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen ruff format --diff src tests packaging/full_suite.py packaging/ci_process_tree.py
      - name: Native strict typing
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen mypy src packaging/full_suite.py packaging/ci_process_tree.py
      - name: Complete tests with synthetic devices and credentials
        if: always() && steps.environment.outcome == 'success'
        id: tests
        run: >-
          uv run --frozen python packaging/full_suite.py
          --deadline ${{ matrix.deadline }}
          --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - name: Preserve synthetic-suite diagnostics
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-suite-${{ matrix.os }}-py${{ matrix.python }}-shard${{ matrix.shard }}of${{ matrix.shards }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-diagnostics/pytest.log
            test-diagnostics/stacks.log
            test-diagnostics/phase.json
            test-diagnostics/timeout.json
            test-diagnostics/result.json
            test-diagnostics/junit.xml
            test-diagnostics/gui
          if-no-files-found: error
          retention-days: 7
