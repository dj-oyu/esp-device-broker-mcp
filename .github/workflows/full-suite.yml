name: Full synthetic suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.13.16'
          - os: windows-2022
            python: '3.14.3'
          - os: ubuntu-24.04
            python: '3.13.16'
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install frozen verification environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --python python
      - name: Lint and format
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: Native strict typing
        run: uv run --frozen mypy src
      - name: Complete tests with synthetic devices and credentials
        run: uv run --frozen pytest -q --tb=short -o faulthandler_timeout=90
