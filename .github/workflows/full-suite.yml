name: Full synthetic suite

on:
  pull_request:
  # Pushes to main only seed the toolcache cache (PRs can restore caches
  # saved on the base branch, not caches from other PRs); tests do not rerun.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-python-toolcache:
    name: warm CPython toolcache
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python: ['3.13.16', '3.14.3']
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Same path and key as the test job below; keep them identical.
      - name: Look up pinned CPython toolcache entry
        id: python-toolcache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/Python/${{ matrix.python }}
          key: python-toolcache-${{ matrix.os }}-cpython-${{ matrix.python }}-x64-v1
          lookup-only: true
      - if: steps.python-toolcache.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Save pinned CPython toolcache entry
        if: steps.python-toolcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/Python/${{ matrix.python }}
          key: python-toolcache-${{ matrix.os }}-cpython-${{ matrix.python }}-x64-v1
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / shard ${{ matrix.shard }} of ${{ matrix.shards }}
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows legs are split into file shards (balanced by file size; see
        # packaging/full_suite.py shard_files). Lint/format/typing run once per
        # OS/Python on shard 1.
        include:
          - os: windows-2022
            python: '3.13.16'
            shard: 1
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 2
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 3
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.13.16'
            shard: 4
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 1
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 2
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 3
            shards: 4
            deadline: 900
          - os: windows-2022
            python: '3.14.3'
            shard: 4
            shards: 4
            deadline: 900
          - os: ubuntu-24.04
            python: '3.13.16'
            shard: 1
            shards: 1
            deadline: 1200
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARDPUTER_GUI_SCREENSHOTS: test-diagnostics/gui
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The pinned Windows CPython is not preinstalled; setup-python would run
      # its installer (~45 s) in every shard. Restore the exact-version toolcache
      # entry instead (exact key, no restore-keys). It is saved immediately after
      # setup-python, before uv or any package touches that interpreter.
      - name: Restore pinned CPython toolcache entry
        if: runner.os == 'Windows'
        id: python-toolcache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/Python/${{ matrix.python }}
          key: python-toolcache-${{ matrix.os }}-cpython-${{ matrix.python }}-x64-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Save pinned CPython toolcache entry
        if: runner.os == 'Windows' && steps.python-toolcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/Python/${{ matrix.python }}
          key: python-toolcache-${{ matrix.os }}-cpython-${{ matrix.python }}-x64-v1
      - name: Install frozen verification environment
        id: environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --python python
      # Tests only: TMP/TEMP on the runner temp drive (D:) instead of the C:
      # profile temp; this roughly halved Windows test time in CI.
      - name: Put test scratch on the runner temp drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/ci_test_scratch.ps1 -Path "$env:RUNNER_TEMP\test-scratch"
      - name: Install Linux compiler-cache contract fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache
          ccache --version
          gcc --version
          cmake --version
      - name: Lint
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen ruff check src tests packaging/full_suite.py packaging/ci_process_tree.py
      - name: Format
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen ruff format --diff src tests packaging/full_suite.py packaging/ci_process_tree.py
      - name: Native strict typing
        if: always() && steps.environment.outcome == 'success' && matrix.shard == 1
        run: uv run --frozen mypy src packaging/full_suite.py packaging/ci_process_tree.py
      - name: Complete tests with synthetic devices and credentials
        if: always() && steps.environment.outcome == 'success'
        id: tests
        run: >-
          uv run --frozen python packaging/full_suite.py
          --deadline ${{ matrix.deadline }}
          --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - name: Preserve synthetic-suite diagnostics
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-suite-${{ matrix.os }}-py${{ matrix.python }}-shard${{ matrix.shard }}of${{ matrix.shards }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-diagnostics/pytest.log
            test-diagnostics/stacks.log
            test-diagnostics/phase.json
            test-diagnostics/timeout.json
            test-diagnostics/result.json
            test-diagnostics/junit.xml
            test-diagnostics/gui
          if-no-files-found: error
          retention-days: 7
