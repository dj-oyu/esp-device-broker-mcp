name: Manifest export pinned FW junction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  junction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
      PRODUCER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FW_HEAD: 824e9f91b52069c08df68e967d83b44e9f7d5240
    steps:
      - name: Preserve committed fixture bytes before either checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PRODUCER_HEAD }}
          persist-credentials: false
          path: producer
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dj-oyu/cardputer-adv-pocketjs
          ref: 824e9f91b52069c08df68e967d83b44e9f7d5240
          persist-credentials: false
          path: firmware
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Verify the two fixed source heads
        run: |
          test "$(git -C producer rev-parse HEAD)" = "$PRODUCER_HEAD"
          test "$(git -C firmware rev-parse HEAD)" = "$FW_HEAD"
          for fixture in tools/games/fixtures/broker_v2/derby_fixed.py tools/games/fixtures/broker_v2/device_faults.py; do
            test "$(git -C firmware hash-object --no-filters "$fixture")" = "$(git -C firmware rev-parse "HEAD:$fixture")"
          done
          mkdir -p producer/junction-results
          printf 'producer=%s\nfirmware=%s\n' "$PRODUCER_HEAD" "$FW_HEAD" > producer/junction-results/heads.txt
          git -C producer rev-parse 'HEAD^{tree}' >> producer/junction-results/heads.txt
          git -C firmware rev-parse 'HEAD^{tree}' >> producer/junction-results/heads.txt
          cat producer/junction-results/heads.txt
      - name: Install frozen dependencies
        working-directory: producer
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --python python
      # Tests only: a dedicated TMP/TEMP outside Defender real-time scanning.
      # The checkouts and .venv stay scanned; the script logs Defender state.
      - name: Exclude test scratch from Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./producer/packaging/ci_defender_scratch.ps1 -Path "$env:RUNNER_TEMP\test-scratch"
      - name: Unmodified response, durable authorization and pinned FW gate
        working-directory: producer
        run: |
          export DERBY_FW_ROOT="$(python -c 'from pathlib import Path; print(Path("../firmware").resolve())')"
          uv run --frozen python -m pytest -q tests/test_manifest_export.py tests/test_manifest_export_binding.py tests/test_manifest_export_fw_consumer.py tests/test_durable_build_logs.py tests/test_dma_build_modes.py tests/test_dma_collector_binding.py --junitxml=junction-results/junit.xml
      - name: Retain synthetic junction diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-export-junction-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer/junction-results/
          if-no-files-found: error
          retention-days: 14
