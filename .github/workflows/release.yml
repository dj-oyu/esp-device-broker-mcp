name: Release

# A tag such as v1.0.0 or v1.0.0-rc.1 builds the Windows ZIP and the Linux
# tarball with the same verified workflows used for pull requests, then
# publishes them in one GitHub Release. A tag containing "-" is marked as a
# pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows-package.yml

  linux:
    uses: ./.github/workflows/linux-package.yml

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only code that reached main may be released.
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cardputer-*-x64-${{ github.run_id }}
          merge-multiple: true
          path: dist
      - name: Check that every file matches its checksum
        run: |
          cd dist
          shopt -s nullglob
          archives=(cardputer-v*-windows-x64.zip cardputer-v*-linux-x64.tar.gz)
          [ "${#archives[@]}" -eq 2 ] || { echo "Expected one ZIP and one tarball, got: ${archives[*]}"; exit 1; }
          for archive in "${archives[@]}"; do
            tr -d '\015' < "$archive.sha256" | sha256sum -c -
          done
      - name: Create the Release
        run: |
          cd dist
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          cat > ../notes.md <<'NOTES'
          Unsigned builds of the Windows x64 executable (ZIP) and the Linux x64
          executable (tarball). Each archive carries `manifest.json` with the exact
          source commit and `SHA256SUMS.txt`; the `.sha256` files cover the archives.

          Verified by the workflow: archive contents and hashes, and an authenticated
          mock-backend smoke test of the extracted executable. Not verified by the
          workflow: real device builds, flashing or hardware behavior.
          NOTES
          gh release create "$TAG" \
            cardputer-v*-windows-x64.zip cardputer-v*-windows-x64.zip.sha256 \
            cardputer-v*-linux-x64.tar.gz cardputer-v*-linux-x64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file ../notes.md --generate-notes "${prerelease[@]}"
