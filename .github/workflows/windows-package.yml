name: Windows executable and ZIP

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'packaging/**'
      - 'src/**'
      - 'tests/test_windows_release.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'LICENSE'
      - 'NOTICE'
      - 'WINDOWS-DISTRIBUTION.md'
      - 'examples/mock-safe.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Validate version and packaging tests
        run: |
          python packaging/release_windows.py --check-version --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frozen application and pinned build tools
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --no-dev --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-deps -r packaging/requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build one console executable
        run: |
          .venv/Scripts/python.exe -m PyInstaller --clean --noconfirm --workpath build/pyinstaller packaging/cardputer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create allowlisted ZIP
        run: |
          python packaging/release_windows.py --exe dist/cardputer.exe --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test extracted executable with authenticated mock HTTP
        run: |
          $archive = Get-ChildItem dist/cardputer-v*-windows-x64.zip
          if (@($archive).Count -ne 1) { throw 'Expected exactly one distribution ZIP' }
          python packaging/smoke_windows.py --archive $archive.FullName --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-windows-x64-${{ github.run_id }}
          path: |
            dist/cardputer.exe
            dist/cardputer-v*-windows-x64.zip
            dist/cardputer-v*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-build-diagnostics-${{ github.run_id }}
          path: |
            build/pyinstaller/cardputer/warn-cardputer.txt
            build/pyinstaller/cardputer/xref-cardputer.html
          if-no-files-found: ignore
          retention-days: 7
