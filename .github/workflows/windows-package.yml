name: Windows executable and ZIP

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'packaging/**'
      - 'src/**'
      - 'tests/test_windows_release.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'LICENSE'
      - 'NOTICE'
      - 'WINDOWS-DISTRIBUTION.md'
      - 'examples/mock-safe.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Validate version and packaging tests
        run: |
          python packaging/release_windows.py --check-version --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frozen application and pinned build tools
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --no-dev --no-install-project --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-deps -r packaging/requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-build-isolation --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build one console executable
        run: |
          .venv/Scripts/python.exe -m PyInstaller --clean --noconfirm --workpath build/pyinstaller packaging/cardputer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create allowlisted ZIP
        run: |
          python packaging/release_windows.py --exe dist/cardputer.exe --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Explicit, logged on-demand scan of exactly what is shipped (exe and ZIP,
      # archive contents included). No exclusion applies to dist/. A detection
      # (exit 2) or any scanner error fails the job; only a runner image without
      # the Defender service/scanner skips, with a warning.
      - name: Scan shipped artifacts with Microsoft Defender
        run: |
          $dist = (Resolve-Path dist).Path
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $service = Get-Service -Name WinDefend -ErrorAction SilentlyContinue
          if (-not (Test-Path $scanner) -or -not $service) {
            Write-Host "::warning::Microsoft Defender is not present on this runner (scanner: $(Test-Path $scanner), service: $([bool]$service)); shipped artifacts were NOT scanned"
            exit 0
          }
          Write-Host "WinDefend service: $($service.Status)"
          Get-MpComputerStatus |
            Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled,
              AMProductVersion, AMEngineVersion, AntivirusSignatureVersion,
              AntivirusSignatureLastUpdated, AntivirusSignatureAge |
            Format-List | Out-String | Write-Host
          Write-Host "Archive scanning disabled: $((Get-MpPreference).DisableArchiveScanning)"
          Get-ChildItem $dist -File | ForEach-Object {
            Write-Host "$($_.Name) $($_.Length) bytes SHA256 $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }
          & $scanner -Scan -ScanType 3 -File $dist -DisableRemediation
          $code = $LASTEXITCODE
          Write-Host "MpCmdRun custom scan of $dist exit code: $code"
          if ($code -eq 2) {
            Get-MpThreatDetection | Format-List | Out-String | Write-Host
            Write-Host '::error::Microsoft Defender reported a threat in the shipped artifacts'
            exit 2
          }
          if ($code -ne 0) {
            Write-Host "::error::Microsoft Defender scan did not complete (exit $code)"
            exit $code
          }
          Write-Host 'Microsoft Defender: no threats found in shipped artifacts'
      - name: Test extracted executable with authenticated mock HTTP
        run: |
          $archive = Get-ChildItem dist/cardputer-v*-windows-x64.zip
          if (@($archive).Count -ne 1) { throw 'Expected exactly one distribution ZIP' }
          .venv/Scripts/python.exe packaging/smoke_windows.py --archive $archive.FullName --ref $env:SOURCE_REF --commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check receipt producer source
        run: |
          python packaging/check_receipt_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-windows-x64-${{ github.run_id }}
          path: |
            dist/cardputer.exe
            dist/cardputer-v*-windows-x64.zip
            dist/cardputer-v*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardputer-build-diagnostics-${{ github.run_id }}
          path: |
            build/pyinstaller/cardputer/warn-cardputer.txt
            build/pyinstaller/cardputer/xref-cardputer.html
          if-no-files-found: ignore
          retention-days: 7
