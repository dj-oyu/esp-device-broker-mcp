name: Flash contract checks

on:
  pull_request:
    paths:
      - '.github/workflows/flash-contract.yml'
      - 'src/cardputer_mcp/flash*.py'
      - 'src/cardputer_mcp/firmware_flash.py'
      - 'tests/test_flash*.py'
      - 'tests/test_source*.py'
      - 'src/cardputer_mcp/source_snapshot.py'
      - 'src/cardputer_mcp/firmware_source.py'
      - 'src/cardputer_mcp/firmware_build.py'
      - 'tests/test_derby*.py'
      - 'src/cardputer_mcp/derby_smoke.py'
      - 'src/cardputer_mcp/smoke_port.py'
      - 'src/cardputer_mcp/serial_backend.py'
      - 'src/cardputer_mcp/broker.py'
      - 'src/cardputer_mcp/models.py'
      - 'src/cardputer_mcp/input_diagnostics.py'
      - 'tests/test_input_diagnostics.py'
      - 'tests/test_mcp_input_http.py'
      - 'src/cardputer_mcp/server.py'
      - 'src/cardputer_mcp/config.py'
      - 'src/cardputer_mcp/plan_approval.py'
      - 'src/cardputer_mcp/profile_jobs.py'
      - 'src/cardputer_mcp/store.py'
      - 'src/cardputer_mcp/build_artifacts.py'
      - 'tests/test_build_artifact_persistence.py'
      - 'src/cardputer_mcp/build_logs.py'
      - 'src/cardputer_mcp/console_logs.py'
      - 'src/cardputer_mcp/operator_timeline.py'
      - 'src/cardputer_mcp/gui_timeline.py'
      - 'src/cardputer_mcp/operator.py'
      - 'src/cardputer_mcp/operator_launch_pipe.py'
      - 'tests/test_operator_launch*.py'
      - 'src/cardputer_mcp/operator_api.py'
      - 'src/cardputer_mcp/operator_client.py'
      - 'src/cardputer_mcp/cli.py'
      - 'tests/test_operator_live_cli.py'
      - 'tests/test_explicit_request_store.py'
      - 'tests/test_console_logs.py'
      - 'tests/test_gui_timeline.py'
      - 'tests/test_gui_cancel_receipt_review.py'
      - 'tests/test_operator_job_cancel.py'
      - 'tests/test_profile_jobs.py'
      - 'tests/test_profile_device_review_independence.py'
      - 'tests/test_worker_callback_bindings.py'
      - 'tests/test_workflow_test_selectors.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    concurrency:
      group: flash-contract-checks-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Offline contract tests without hardware
        run: |
          foreach ($pattern in @('test_flash_manifest_contract.py','test_flash_lifecycle.py','test_flash_backup.py','test_flash_worker.py','test_flash_security.py')) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locked verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --no-install-project --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-deps uv-build==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-build-isolation --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contract tests with actual locked dependencies
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_flash*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unattended flash authorization without hardware
        timeout-minutes: 5
        run: |
          .venv/Scripts/python.exe -m pytest -vv --tb=short -o faulthandler_timeout=60 tests/test_flash_policy.py tests/test_flash_lease_renewal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source/build, authorization and device integration without hardware
        timeout-minutes: 12
        run: |
          .venv/Scripts/python.exe -m pytest -vv --tb=short -o faulthandler_timeout=60 tests/test_flash_http.py tests/test_source_http.py tests/test_source_snapshot.py tests/test_profile_jobs.py tests/test_profile_device_review_independence.py tests/test_worker_callback_bindings.py tests/test_workflow_test_selectors.py tests/test_build_approval_integration.py tests/test_build_artifact_persistence.py tests/test_derby_smoke.py tests/test_derby_http.py tests/test_serial_backend.py tests/test_capture_broker.py tests/test_plan_approval.py tests/test_broker.py tests/test_review_invariants.py tests/test_session_safety_review.py tests/test_queued_principal_recheck.py tests/test_pending_execution.py tests/test_pending_execution_http.py tests/test_http_security.py tests/test_input_diagnostics.py tests/test_mcp_input_http.py tests/test_registry_http.py tests/test_work_sessions.py tests/test_operator_timeline.py tests/test_operator_timeline_http.py tests/test_gui_timeline.py tests/test_gui_cancel_receipt_review.py tests/test_operator_job_cancel.py tests/test_gui_retention_review.py tests/test_explicit_request_store.py tests/test_image_delivery.py tests/test_capture_policy_http.py tests/test_gui_shutdown_review.py tests/test_console_logs.py tests/test_stdio_adapter.py tests/test_stdio_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retired local approval CLI remains inert without hardware
        timeout-minutes: 2
        run: |
          .venv/Scripts/python.exe -m pytest -vv --tb=short -o faulthandler_timeout=60 tests/test_operator_live_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retired approval relay and HTTP contracts without hardware
        timeout-minutes: 2
        run: |
          .venv/Scripts/python.exe -m pytest -vv --tb=short -o faulthandler_timeout=60 tests/test_operator_launch_http.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source and build regression
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_source_lifecycle.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_firmware_build.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real public Cardputer archive integrity without build or USB
        run: |
          .venv/Scripts/python.exe packaging/source_public_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  diagnostics:
    concurrency:
      group: flash-contract-diagnostics-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Locked verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --no-install-project --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-deps uv-build==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe --no-build-isolation --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Integration style diagnostics
        if: success() || failure()
        run: |
          .venv/Scripts/python.exe packaging/check_flash_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows type checks against the same base
        if: success() || failure()
        env:
          FLASH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          .venv/Scripts/python.exe packaging/check_flash_types.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
