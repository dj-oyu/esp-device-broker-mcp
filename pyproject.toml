[project]
name = "cardputer-device-mcp"
version = "0.12.0"
description = "A single-owner, mock-first Cardputer device broker over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pyserial>=3.5,<4",
    "filelock>=4,<5",
    "httpx2>=2.13,<3",
    "uvicorn>=0.54,<1",
    "starlette>=1.7,<2",
    "pydantic>=2.13,<3",
]

[project.scripts]
cardputer = "cardputer_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cardputer_mcp"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<0.17", "mypy>=2.4,<3", "types-pyserial>=3.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC110"]  # CLI polls a remote job; no in-process event is available

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cardputer_mcp"]
