# SYNTHETIC example only. Copy to device.local.toml, then supply private values.
# This file is NOT permission to open a device. Real mode additionally requires
# --enable-serial, explicit authentication, an owned lease and exact-plan execute.
backend = "serial"
host = "127.0.0.1"
port = 8765
state_dir = ".state/serial"
allow_mock_execution = false

[serial]
protocol = "pocketjs-hello-v1"
observe_seconds = 2
# Replace with the expected firmware image hash before preparing HELLO.
# This binds configuration; it is not an on-device measurement of running firmware.
expected_firmware_sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[serial.selector]
vid = 51966 # Synthetic 0xCAFE, not a real Cardputer identification claim
pid = 1
serial_number = "SYNTHETIC-ONLY-REPLACE-ME"
# Optional USB location may narrow selection further. No fixed COM name.
