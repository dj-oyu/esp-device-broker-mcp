# Copy to broker.local.toml. The broker, GUI, and Tunnel launcher use this SAME file.
# All relative paths resolve from the project directory, not from this file's folder.
# Metadata only: NEVER store API keys, client keys, bearer tokens, or autoconnect here.
backend = "mock"
host = "127.0.0.1"
port = 8765
state_dir = ".state/tunnel-mock"

[tunnel]
# Default "off". Set mode = "ingress" for forwarded requests, then restart the idle broker.
# The GUI and local CLI keep /mcp; only the official client uses /tunnel/mcp.
mode = "off"
# Replace the placeholder with your already-provisioned ID before Connect.
# Loading this file starts no Tunnel; the placeholder is rejected by Connect preflight.
tunnel_id = "tunnel_00000000000000000000000000000000"
client_exe = 'C:\Tools\tunnel-client-v0.0.15\tunnel-client.exe'
client_archive = 'C:\Downloads\tunnel-client-v0.0.15-windows-amd64.zip'
health_port = 8766
